<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KanjiGO — Học Kanji kiểu Pokémon</title>
<link rel="stylesheet" href="css/fonts.css" />
<!--
  ============================================================
   KanjiGO (offline, double-click là chơi)
   • Combat REALTIME: đọc đúng kanji (On/Kun) mới ra đòn.
   • Đọc nhanh để đẩy lùi Attack Gauge; đủ năng lượng sẽ tung tuyệt kỹ.
   • Giảng đường: học theo thứ tự Kanji Dex hoặc tự chọn một Kanji chưa unlock.
   • Kanji Dex (phím D): xem & đổi pet đi sau lưng.
   • Admin thêm chữ/câu dễ dàng: mở admin.html (dán từ Excel) HOẶC sửa js/kanji.js.
     js/config.js cấu hình • js/kanji.js dữ liệu mặc định
     js/data-loader.js nạp dữ liệu admin import • js/map.js bản đồ • js/game.js engine
  ============================================================
-->
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12121f;color:#eee;
    font-family:var(--kanjigo-font)}
  body{display:block}
  h1{font-size:20px;margin:12px 0 2px;letter-spacing:1px}
  h1 .go{color:#6cc0ff}
  #hint{font-size:13px;color:#9aa;margin-bottom:10px;text-align:center;line-height:1.7}
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;
    border:0;border-radius:0;box-shadow:none;image-rendering:pixelated;background:#000;touch-action:none}
  #touch-controls,#touch-actions,#touch-back{display:none;position:fixed;z-index:2;touch-action:none;user-select:none}
  #touch-controls{left:18px;bottom:18px;width:150px;height:150px}
  #touch-controls button,#touch-actions button{position:absolute;width:50px;height:50px;padding:0;
    border:2px solid rgba(159,216,245,.75);border-radius:14px;background:rgba(11,16,48,.78);
    color:#fff;font-size:24px;box-shadow:0 4px 12px rgba(0,0,0,.35);touch-action:none}
  #touch-controls button:active,#touch-actions button:active{background:rgba(22,85,143,.95);transform:scale(.94)}
  .touch-hidden{display:none!important}
  #touch-up{left:50px;top:0}.touch-left{left:0;top:50px}.touch-right{right:0;top:50px}.touch-down{left:50px;bottom:0}
  #touch-actions{right:18px;bottom:28px;width:352px;height:58px;gap:8px}
  #touch-actions button{position:static;width:64px;height:52px;font-size:14px;font-weight:700}
  #touch-actions .touch-dex{color:#ffd54a}
  #touch-actions .touch-skills{color:#7ff7ff}
  #touch-actions .touch-bike{color:#ffcf6c}
  #touch-actions .touch-auto{color:#8fffb0}
  #touch-back{right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));z-index:10;
    width:auto;min-width:88px;height:46px;padding:0 14px;border:2px solid rgba(159,216,245,.82);
    border-radius:23px;background:rgba(11,16,48,.94);color:#fff;font-size:13px;font-weight:800;
    letter-spacing:.35px;box-shadow:0 4px 12px rgba(0,0,0,.4);touch-action:manipulation}
  #touch-back:active{background:rgba(22,85,143,.98);transform:scale(.95)}
  #touch-back.combat-back{top:max(116px,calc(env(safe-area-inset-top) + 116px));min-width:82px;height:44px;
    background:rgba(70,22,28,.94);border-color:rgba(255,155,155,.9)}
  #touch-back.continue-action{background:rgba(18,92,62,.95);border-color:rgba(126,255,190,.9)}
  #settings-open{display:block;position:fixed;z-index:12;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));
    width:46px;height:46px;padding:0;border:2px solid rgba(159,216,245,.82);border-radius:14px;background:rgba(11,16,48,.94);
    color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  #settings-open .settings-key{position:absolute;right:-5px;bottom:-5px;display:grid;place-items:center;width:18px;height:18px;
    border:1px solid #ffd54a;border-radius:6px;background:#172640;color:#ffd54a;font:800 10px var(--kanjigo-font)}
  #settings-open:focus-visible,#settings-close:focus-visible,#settings-reset:focus-visible,
  #settings-panel input:focus-visible{outline:3px solid #ffd54a;outline-offset:3px}
  #settings-overlay{display:none;position:fixed;z-index:30;inset:0;align-items:center;justify-content:center;padding:24px;
    background:rgba(5,9,24,.78);overflow:auto}
  #settings-overlay.is-open{display:flex}
  #settings-panel{width:min(500px,100%);box-sizing:border-box;padding:24px;background:#141c3c;color:#e9eef7;border:2px solid #2f7fc0;
    box-shadow:0 12px 40px rgba(0,0,0,.5);font-family:var(--kanjigo-font)}
  #settings-panel h2{margin:0 0 6px;color:#fff;font-size:24px}
  #settings-panel>p{margin:0 0 20px;color:#9fd8f5;font-size:13px}
  .settings-section{padding:16px;border:1px solid rgba(82,126,170,.55);border-radius:10px;background:rgba(8,18,45,.46)}
  .settings-section h3{margin:0 0 12px;color:#ffd970;font-size:15px;letter-spacing:.6px;text-transform:uppercase}
  .audio-setting-row{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;margin:16px 0}
  .audio-setting-row label{font-weight:600}
  .audio-setting-row output{min-width:42px;color:#ffd54a;text-align:right;font-variant-numeric:tabular-nums}
  .audio-setting-row input[type="range"]{grid-column:1 / -1;width:100%;accent-color:#6cc0ff}
  .audio-setting-check{display:flex;align-items:center;gap:10px;margin:22px 0;font-weight:600}
  .audio-setting-check input{width:18px;height:18px;accent-color:#6cc0ff}
  .settings-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
  .settings-actions button{min-height:42px;padding:8px 16px;border:1px solid #2f7fc0;border-radius:8px;background:#16558f;color:#fff;font-weight:700;cursor:pointer}
  .settings-actions button.secondary{background:transparent;color:#c8d5ee;border-color:#52617b}
  @media(pointer:coarse), (max-width:700px){#settings-open{top:auto;bottom:max(18px,env(safe-area-inset-bottom));right:max(166px,calc(50% - 23px))}}
  kbd{background:#0f3460;border-radius:4px;padding:1px 6px;
    font-family:monospace;color:#fff;border:1px solid #16558f}
  #admin-link{margin-top:10px;font-size:12px;color:#9fd8f5}
  #admin-link a{color:#6cc0ff}
  h1,#hint,#admin-link{display:none}
  @media (pointer:coarse), (max-width:700px){
    #touch-controls,#touch-back{display:block}#touch-actions{display:flex}
    #touch-controls{left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom))}
    #touch-actions{right:max(12px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom))}
  }
  @media (max-width:430px){
    #touch-actions{width:138px;height:168px;flex-wrap:wrap;align-content:flex-end;justify-content:flex-end}
  }
</style>
</head>
<body>
<h1>🎮 Kanji<span class="go">GO</span> — Học Kanji kiểu Pokémon</h1>
<div id="hint">
  Di chuyển <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> • Tương tác <kbd>Space</kbd> • Kanji Dex <kbd>D</kbd>

  ⚔️ Trong trận: bấm <kbd>1</kbd>–<kbd>4</kbd> để ra đòn • Trả lời nhanh nhận PERFECT • <kbd>Esc</kbd> bỏ chạy
</div>
<canvas id="game" width="640" height="480"></canvas>
<div id="touch-controls" aria-label="Điều khiển di chuyển">
  <button id="touch-up" data-key="arrowup" aria-label="Đi lên">▲</button>
  <button class="touch-left" data-key="arrowleft" aria-label="Đi sang trái">◀</button>
  <button class="touch-right" data-key="arrowright" aria-label="Đi sang phải">▶</button>
  <button class="touch-down" data-key="arrowdown" aria-label="Đi xuống">▼</button>
</div>
<div id="touch-actions" aria-label="Thao tác">
  <button data-action="interact" aria-label="Tương tác">SPACE</button>
  <button class="touch-dex" data-action="dex" aria-label="Mở Kanji Dex">DEX</button>
  <button class="touch-skills" data-action="skills" aria-label="Mở Skill Tree">SKILL</button>
  <button class="touch-bike" data-action="bicycle" aria-label="Bật hoặc tắt xe đạp">BIKE</button>
  <button class="touch-auto" data-action="auto-ride" aria-label="Bật hoặc tắt Auto Ride">AUTO</button>
</div>
<button id="touch-back" type="button" class="touch-hidden" data-action="back" aria-label="Quay lại" title="Quay lại">QUAY LẠI</button>
<button id="settings-open" type="button" aria-label="Mở cài đặt" aria-keyshortcuts="O" title="Cài đặt (O)">⚙<span class="settings-key" aria-hidden="true">O</span></button>
<div id="settings-overlay" role="presentation" aria-hidden="true">
  <section id="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title" tabindex="-1">
    <h2 id="settings-title">Cài đặt</h2>
    <p>Nhấn <strong>O</strong> để mở/đóng nhanh hoặc <strong>Esc</strong> để quay lại game.</p>
    <div class="settings-section" aria-labelledby="settings-audio-title">
      <h3 id="settings-audio-title">🔊 Âm thanh</h3>
      <div class="audio-setting-row">
        <label for="audio-master">Master Volume</label><output id="audio-master-value" for="audio-master">100%</output>
        <input id="audio-master" type="range" min="0" max="100" step="1" value="100" data-audio-setting="master" />
      </div>
      <div class="audio-setting-row">
        <label for="audio-music">Music Volume</label><output id="audio-music-value" for="audio-music">70%</output>
        <input id="audio-music" type="range" min="0" max="100" step="1" value="70" data-audio-setting="music" />
      </div>
      <div class="audio-setting-row">
        <label for="audio-sfx">SFX Volume</label><output id="audio-sfx-value" for="audio-sfx">80%</output>
        <input id="audio-sfx" type="range" min="0" max="100" step="1" value="80" data-audio-setting="sfx" />
      </div>
      <div class="audio-setting-row">
        <label for="audio-ui">UI Volume</label><output id="audio-ui-value" for="audio-ui">80%</output>
        <input id="audio-ui" type="range" min="0" max="100" step="1" value="80" data-audio-setting="ui" />
      </div>
      <div class="audio-setting-row">
        <label for="audio-ambient">Ambient Volume</label><output id="audio-ambient-value" for="audio-ambient">60%</output>
        <input id="audio-ambient" type="range" min="0" max="100" step="1" value="60" data-audio-setting="ambient" />
      </div>
      <label class="audio-setting-check" for="audio-muted"><input id="audio-muted" type="checkbox" data-audio-setting="muted" /> Tắt toàn bộ âm thanh</label>
    </div>
    <div class="settings-actions">
      <button id="settings-reset" class="secondary" type="button">Khôi phục mặc định</button>
      <button id="settings-close" type="button">Xong</button>
    </div>
  </section>
</div>
<div id="admin-link">🛠️ Admin nhập chữ/câu: mở <a href="admin.html">admin.html</a></div>

<script src="js/content-catalog.js"></script>
<script src="js/config.js"></script>
<script src="js/audio-config.js"></script>
<script src="js/audio-manager.js"></script>
<script src="js/audio-settings-ui.js"></script>
<script src="js/kanji.js"></script>
<script src="js/data-loader.js"></script>
<script src="js/map.js"></script>
<script src="js/game.js"></script>
</body>
</html>
